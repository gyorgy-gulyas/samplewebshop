# Optional. The sample runs, logs, traces and measures itself with none of this - the spans are
# created and never exported, and /metrics is served by the service. This is here for when you want
# to LOOK at them.
#
#   docker compose -f deploy/observability/docker-compose.yml up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 dotnet run --project src/Sales/Service
#
# Then: traces at http://localhost:16686, metrics at http://localhost:9090.

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # the UI
      - "4317:4317"     # OTLP over gRPC, which is what Otlp:Endpoint points at

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      # so the container can scrape a service running on the host
      - "host.docker.internal:host-gateway"
